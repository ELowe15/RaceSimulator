<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZGHGLHZ4R2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-ZGHGLHZ4R2');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Race</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="finish-line1"></div>
    <div class="finish-line2"></div>
    <!-- Error message for user-->
    <div id="errorPopup" class="error-popup"></div>

    <div class="controls">

        <label class="title" >Fantasy Draft Race</label>

        <!-- Race Type Section -->
        <div class="control-container">
            <label class="label" for="raceTypeSelect">Race Type: </label>
            <select id="raceTypeSelect" class="styled-dropdown">
                <option value="Balanced">Balanced</option>
                <option value="Hectic">Hectic</option>
                <option value="Close">Close</option>
            </select>
        </div>

        <!-- Sport Selection Section -->
        <div class="control-container" id="sportSection">
            <label class="label" for="sportSelect">Select Sport: </label>
            <select id="sportSelect" class="styled-dropdown">
                <option value="Basketball">Basketball</option>
                <option value="Football">Football</option>
                <option value="Hockey">Hockey</option>
                <option value="Baseball">Baseball</option>
            </select>
        </div>

        <!-- Battle Royale Mode Section -->
        <div id="battleSection" class="battle-container">
            <label class="label" for="battleRoyaleToggle">Battle Royale Mode:</label>
            <input type="checkbox" id="battleRoyaleToggle" class="checkbox">
        </div>

        <!-- Race Time Section -->
        <div class="control-container" id="raceTimeSection">
            <label class="label" for="raceTime">Approximate Race Time (s):</label>
            <input type="number" id="raceTime" value="10" min="1">
        </div>

        <!-- Number of Players Section -->
        <div class="control-container" id="playerNumberSection">
            <label class="label" for="numberOfPlayers">Number of Players:</label>
            <input type="number" id="numberOfPlayers" value="12" min="1" max="30">
        </div>

        <!-- Record Mode Section -->
        <div id="recordSection" class="battle-container">
            <label class="label" for="recordToggle">Record Race Video:</label>
            <input type="checkbox" id="recordToggle" class="checkbox">
        </div>

        <!-- Buttons -->
        <button id="playerListButton">Player List</button>
        <button id="startButton">Start Race</button>
        <button id="nextButton" style="display: none;">Next Race</button>
        <button id="standingsButton">Show Standings</button>
        <button id="loadMusicButton">Load Music</button>
        <div class="button-container">
            <button id="saveButton">Save Settings</button>
            <button id="loadButton">Load Settings</button>
        </div>

        <!-- Music File Input (hidden) -->
        <input type="file" id="musicFileInput" accept="audio/*,video/mp4" style="display: none;">
    </div>

    <div class="standings-div" id="standingsDiv" style="visibility: hidden;">
        <h3>Standings</h3>
        <div id="standingsContent" class="scrollable-content"></div>
        <div class="button-container">
            <button id="copyButton">Copy</button>
            <button id="closeButton">Close</button>
        </div>
    </div>

    <div id="playerListContent" class="scrollable-content"></div>

    <script src="raceTools.js"></script>
    <script src="helpers.js"></script>
    <script src="models/Player.js"></script>
    <script src="models/RaceSettings.js"></script>
    <script src="factories/PlayerFactory.js"></script>
    <script src="orchestrators/RaceOrchestrator.js"></script>
    <script src="recorder.js"></script>
    <script src="script.js"></script>
</body>
</html>
